<!-- Main modal -->
<div class="relative px-4 py-2 w-md max-w-[90vw] max-h-[90vh] mb-10" (click)="$event.stopPropagation()">
    <!-- Modal content -->
    <div class="relative bg-white border border-gray-200 rounded-xl shadow-sm p-4 md:p-6">
        <!-- Modal header -->
        <div class="flex items-center justify-between border-b border-default pb-2">
            <h3 class="text-lg font-medium text-heading capitalize">
                {{ headerText() }}
            </h3>
            <button (click)="onCloseClick()" type="button" class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center cursor-pointer" data-modal-hide="authentication-modal">
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                <span class="sr-only">Close modal</span>
            </button>
        </div>
        <!-- Modal body -->
        @if (showWarning()){
            <div class="p-4 flex items-center bg-red-50 w-full rounded-xl border border-red-200">
                <p class="text-sm flex-1 text-center">{{ this.errorMessage() }}</p>
                <button (click)="closeWarningClick()" type="button" class="justify-center items-center cursor-pointer p-1" data-modal-hide="authentication-modal">
                        <svg class="w-4 h-4 text-red-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                        <span class="sr-only">Close modal</span>
                </button>
            </div>
        }
        <form [formGroup]="reminderForm" (ngSubmit)="addEditReminder()" ngNativeValidate class="flex flex-col gap-y-2 pt-5">
            <div class="flex flex-col md:flex-row gap-5">
                <div class="flex flex-1 flex-col gap-3">  
                    <div class="w-full">
                        <label for="reminderTypeId">Reminder type</label>         
                        <div class="block w-full p-2 ps-2 border border-gray-300 rounded-lg  bg-gray-50">
                            <select id="reminderTypeId" formControlName="reminderTypeId" class="w-full text-heading text-sm">
                                @for(type of this.references()?.reminderTypes; track type.id){
                                    <option [value]="type.id">{{ type.name }}</option>
                                }
                            </select>
                        </div> 
                    </div>

                    <div class="flex flex-col gap-3">
                        <label for="reocurrence">Reocurrence frequency</label>             
                        <div id="reocurrence" class="w-full flex flex-wrap gap-3">   
                            <div class="relative flex items-center border border-gray-300 text-sm rounded-lg focus:ring-2 shadow-xs bg-gray-5">
                                <span class="py-2 absolute left-2 text-xs text-gray-400 italic pointer-events-none">
                                    Repeat every:
                                </span>
                                <input class="py-2 w-[135px] pl-[85px] h-full rounded-lg" id="frequencyNum" formControlName="frequencyNum" inputmode="numeric" autocomplete="off" required numbersOnly/>
                            </div>           
                            <div class="flex-1 block w-full p-2 ps-2 border border-gray-300 rounded-lg bg-gray-50">
                                <select id="frequencyTypeId" formControlName="frequencyTypeId" class="w-full text-heading text-sm" required>
                                    @for(frequency of this.references()?.frequencyTypes; track frequency.id){
                                        <option [value]="frequency.id">{{ frequency.name }}(s)</option>
                                    }
                                </select>
                            </div> 
                        </div>   
                    </div> 

                    <div class="w-full">
                        <label for="originalDueDate">Next due date</label>  
                        <input type="datetime-local" id="originalDueDate" formControlName="originalDueDate" [min]="minDate" class="w-full px-2 py-2 text-sm rounded-lg border border-gray-300 focus:ring-none" required>
                    </div>
                    
                    <div>
                        <label for="note">Note</label>
                        <textarea id="note" formControlName="note" placeholder="e.g. Use distilled water only, avoid wetting the leaves,..." rows="3"></textarea>
                    </div> 
                </div> 
            </div>    
            <div class="self-end w-full md:w-auto flex">
                <button type="button" class="flex-1 mt-4 text-sm py-2 px-10 cursor-pointer">
                    Cancel
                </button>
                <button type="submit" class="whitespace-nowrap flex-1 mt-4 bg-green-900 hover:bg-green-800 text-white text-sm py-2 px-10 rounded-full transition-all cursor-pointer">
                    {{ buttonText() }}
                </button>
            </div>
        </form>
    </div>
</div>
