<!-- Main modal -->
<div class="relative px-4 py-2 w-4xl max-w-[90vw] max-h-[90vh] mb-10" (click)="$event.stopPropagation()">
    <!-- Modal content -->
    <div class="relative bg-white border border-gray-200 rounded-xl shadow-sm p-4 md:p-6">
        <!-- Modal header -->
        <div class="flex items-center justify-between border-b border-default pb-2">
            <h3 class="text-lg font-medium text-heading">
                {{ 'group.manage' | translate }}
            </h3>
            <button (click)="onCloseClick()" type="button" class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center cursor-pointer" data-modal-hide="authentication-modal">
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                <span class="sr-only">Close modal</span>
            </button>
        </div>
        <!-- Modal body -->
        <div class="grid grid-cols-5 gap-3 pt-2">
        @for(plant of plantedList()?.planted; track plant.id){
            <div class="bg-white flex flex-col shadow-lg shadow-gray-400/50 rounded-2xl overflow-hidden cursor-pointer border-4"
                (click)="togglePlantSelection(plant.id)"
                [class.border-green-600]="selectedPlants().includes(plant.id)"
                [class.border-purple-600]="selectedPlants().includes(plant.id) &&
                                            plant.plantGroup?.id != null &&
                                            plant.plantGroup?.id !== groupId()"
                [class.border-transparent]="!selectedPlants().includes(plant.id)"
                >        
                <div class="relative h-25 sm:h-25 w-full overflow-hidden rounded-t-xl bg-gray-100 flex-shrink-0 content-center">
                    @if (plant.image) {
                        <img [src]="plant.image" (error)="plant.image = 'assets/icons/placeholder.svg'" class="w-full h-full object-cover"/>
                    } @else {
                        <svg class="lucide lucide-sprout-icon lucide-sprout w-16 h-16 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/>
                        </svg>
                    }   
                    
                    <input 
                        type="checkbox" 
                        class="absolute top-2 right-2 w-6 h-6 opacity-0 pointer-events-none"
                        [checked]="selectedPlants().includes(plant.id)"
                    />

                    @if(selectedPlants().includes(plant.id)){
                        <div class="absolute top-2 right-2 w-6 h-6 bg-green-600 rounded-full flex items-center justify-center text-white">
                            ✓
                        </div>
                    }
                </div>           
                
                <div class="flex flex-col p-3 h-full justify-between">          
                    <div class="my-2 flex-grow flex-1 flex-col items-center justify-center">
                        <h2 class="font-bold text-green-900 leading-tight capitalize">{{plant.plantName}}</h2>
                        <p class="text-sm text-red-500 pt-2"
                            [class.text-red-500]="plant.plantGroup?.id != null && 
                                                plant.plantGroup?.id !== groupId()"
                            [class.text-green-600]="plant.plantGroup?.id === groupId()"
                        >{{ plant.plantGroup?.name ?? '/' }}</p>

                        <div class="flex flex-col gap-y-1 pt-2">
                            <div class="flex flex-wrap items-center gap-x-1">
                                <svg class="h-4 w-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="256" height="256" viewBox="0 0 256 256" xml:space="preserve">
                                    <g style="stroke: none; stroke-width: 0; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: none; fill-rule: nonzero; opacity: 1;" transform="translate(1.4065934065934016 1.4065934065934016) scale(2.81 2.81)">
                                        <path d="M 45 90 c -1.415 0 -2.725 -0.748 -3.444 -1.966 l -4.385 -7.417 C 28.167 65.396 19.664 51.02 16.759 45.189 c -2.112 -4.331 -3.175 -8.955 -3.175 -13.773 C 13.584 14.093 27.677 0 45 0 c 17.323 0 31.416 14.093 31.416 31.416 c 0 4.815 -1.063 9.438 -3.157 13.741 c -0.025 0.052 -0.053 0.104 -0.08 0.155 c -2.961 5.909 -11.41 20.193 -20.353 35.309 l -4.382 7.413 C 47.725 89.252 46.415 90 45 90 z" style="stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill-rule: nonzero; opacity: 1;" fill="currentColor" transform=" matrix(1 0 0 1 0 0) " stroke-linecap="round"/>
                                        <path d="M 45 45.678 c -8.474 0 -15.369 -6.894 -15.369 -15.368 S 36.526 14.941 45 14.941 c 8.474 0 15.368 6.895 15.368 15.369 S 53.474 45.678 45 45.678 z" style="stroke: none; stroke-width: 1; stroke-dasharray: none; stroke-linecap: butt; stroke-linejoin: miter; stroke-miterlimit: 10; fill: rgb(255,255,255); fill-rule: nonzero; opacity: 1;" transform=" matrix(1 0 0 1 0 0) " stroke-linecap="round"/>
                                    </g>
                                </svg>
                                <p class="text-sm text-gray-500">{{ plant.place }}</p>
                            </div>
                            <div class="flex flex-wrap items-center gap-x-1">
                                <svg class="w-4 h-4 text-gray-500 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/>
                                </svg>
                                <p class="text-sm text-gray-500">{{ plant.datePlanted }}</p>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        }
        </div>
        <button (click)="saveList()" class="mt-7 w-full bg-green-900 hover:bg-green-800 text-white text-sm py-2 px-4 rounded-full transition-all cursor-pointer">
            {{ 'group.saveList' | translate }}
        </button>
    </div>
</div>
