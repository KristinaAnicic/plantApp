<nav class="relative">
    <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between">
        <div class="absolute inset-y-0 left-0 flex items-center md:hidden">
            <!-- Mobile menu button-->
            <button type="button" (click)="toggleMenu()" class="relative inline-flex items-center justify-center rounded-md p-2 text-green-900 focus:outline-2 focus:-outline-offset-1 focus:outline-green-900">
            <span class="absolute -inset-0.5"></span>
            <span class="sr-only">Open main menu</span>
            @if (!isMobileMenuOpen()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            }
            @else{
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            }
            </button>
        </div>
        <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
            <div class="flex shrink-0 items-center justify-start">           
                <img src="assets/images/logo.png"  class="h-10 w-auto" >
            </div>
            <div class="hidden sm:ml-6 sm:flex sm:flex-1 sm:justify-center">
                <div class="flex space-x-4">
                    <div class="py-2 border-b-3 border-transparent hover:border-b-2 hover:border-green-900">
                        <a href="#" class="rounded-md px-3 py-2 text-base font-medium text-green-900 hover:font-semibold">Plants</a>
                    </div>                 
                    <div class="py-2 border-b-3 border-transparent hover:border-b-2 hover:border-green-900">
                        <a href="#" class="rounded-md px-3 py-2 text-base font-medium text-green-900 hover:font-semibold">Community</a>
                    </div>  
                    @if(authService.isAuthenticated()) {
                    <div class="py-2 border-b-3 border-transparent hover:border-b-2 hover:border-green-900">
                        <a href="/my-plants" class="rounded-md px-3 py-2 text-base font-medium text-green-900 hover:font-semibold">My Plants</a>
                    </div>
                    <div class="py-2 border-b-3 border-transparent hover:border-b-2 hover:border-green-900">
                        <a href="#" class="rounded-md px-3 py-2 text-base font-medium text-green-900 hover:font-semibold">Reminders</a>
                    </div>  
                    }                         
                </div>
            </div>
        </div>
        <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">           
            @if (authService.isAuthenticated()){
                <button type="button" class="relative rounded-full p-1 text-gray-400 focus:outline-2 focus:outline-offset-2 focus:outline-green-900">
                    <span class="absolute -inset-1.5"></span>
                    <span class="sr-only">View notifications</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
                        <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>

                <!-- Profile dropdown -->
                <div class="relative ml-3">
                    <button (click)="isUserMenuOpen.set(!isUserMenuOpen())"
                            class="relative cursor-pointer flex rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-900">
                        <span class="absolute -inset-1.5"></span>
                        <span class="sr-only">Open user menu</span>
                        <svg class="w-8 h-8 text-body-subtle size-6 rounded-full text-gray-600" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                        </svg>

                    </button>

                    @if (isUserMenuOpen()){         
                    <div class="fixed inset-0 z-10" (click)="isUserMenuOpen.set(false)"></div>       
                    <div class="absolute right-0 z-20 mt-2 w-48 origin-top-right rounded-md bg-white shadow-lg shadow-gray-400/50 ring-1 ring-gray-200 ring-opacity-5 focus:outline-none">
                        <a href="#" class="block px-4 py-3 text-sm text-gray-700 focus:bg-gray-100 focus:outline-hidden hover:bg-gray-100">Your profile</a>
                        <a (click)="signOut()" class="block px-4 py-3 text-sm text-gray-700 focus:bg-gray-100 focus:outline-hidden hover:bg-gray-100">Sign out</a>
                    </div>
                    }
                </div>
            }
            @else {
                <button [routerLink]="['/login']" class="bg-green-900 hover:opacity-80 text-white text-base font-semibold py-2 px-4 rounded-full cursor-pointer" >
                    Login
                </button>              
            }        
            </div>
        </div>
    </div>

    @if (isMobileMenuOpen()) {
    <div id="mobile-menu" class="block">
        <div class="space-y-0 px-2 pt-2 pb-3">
        <a href="#" (click)="closeMenu()" aria-current="page" class="block rounded-md bg-green-900 px-3 py-2 text-base font-medium text-white">Plants</a>
        <a href="#" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-medium text-green-900 hover:bg-[#b4c0b5] hover:text-green-950">Community</a>
        @if(authService.isAuthenticated()){
            <a href="/my-plants" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-medium text-green-900 hover:bg-[#b4c0b5] hover:text-green-950">My Plants</a>
            <a href="/my-plants" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-medium text-green-900 hover:bg-[#b4c0b5] hover:text-green-950">Reminders</a>
        }    
    </div>
    </div>
    }
</nav>

@if (isLoginOpen) {
    <app-login-modal (close)="toggleLoginModal()"></app-login-modal>
}
