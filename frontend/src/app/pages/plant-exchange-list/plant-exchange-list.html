<div class="flex flex-col w-full px-10">
    <h2 class="pt-3 font-bold text-2xl">Plant Trade</h2>
    <div class="w-full flex justify-between py-5 items-end">
        <div class="w-full flex flex-wrap gap-2">
            <div class="w-full max-w-md">
                <app-search-component (searchTriggered)="search($event)" [currentText]="currentSearchTerm()" [placeholder]="'Search listings...'"></app-search-component>
            </div>
            <div class="w-full max-w-xs">
                <app-search-component (searchTriggered)="searchCity($event)" [currentText]="currentCitySearchTerm()" [placeholder]="'Search cities...'" [iconType]="'location'"></app-search-component>
            </div>
        </div>
        @if (authService.isAdmin()) {
        <div class="flex-none">
            <button (click)="addNewPlantExchangeClick()" type="button" class="bg-green-900 text-white cursor-pointer font-medium rounded text-xs px-5 py-3 focus:outline-none">Add Plant</button>
        </div>
        }
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-3 justify-center">      
        @for (exchange of exchanges(); track exchange.id){
            <div [routerLink]="['/trade', exchange.id]" class="bg-white flex flex-col transition hover:scale-102 shadow-lg shadow-green-900/50 rounded-2xl overflow-hidden cursor-pointer">     
                <div class="relative h-54 sm:h-48 w-full overflow-hidden rounded-t-xl bg-gray-100 flex-shrink-0 content-center">
                    @if (exchange.image) {
                        <img [src]="exchange.image" (error)="exchange.image = 'assets/icons/placeholder.svg'" class="w-full h-full object-cover"/>
                    } @else {
                        <svg class="lucide lucide-sprout-icon lucide-sprout w-16 h-16 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/>
                        </svg>
                    }

                    <div class="absolute top-0 left-1 flex">
                        <p [class]="'text-sm text-gray-700 mt-1 py-1 px-3 rounded-full ' + getExchangeClass(exchange.exchangeType?.name)">
                            {{exchange.exchangeType?.name}}
                        </p>
                    </div>
                </div>           
                
                <div class="flex flex-col p-3 h-full justify-between">          
                    <div class="my-2 flex-grow flex-1 flex-col items-center justify-center">
                        <h2 class="font-bold text-green-900 leading-tight capitalize">{{exchange.title}}</h2>
                        <h2 class="flex items-center text-sm italic text-gray-500 mt-1 capitalize">
                            <svg class="w-4 h-4 text-green-900/70" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                <path fill-rule="evenodd" d="m11.54 22.351.07.04.028.016a.76.76 0 0 0 .723 0l.028-.015.071-.041a16.975 16.975 0 0 0 1.144-.742 19.58 19.58 0 0 0 2.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 0 0-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 0 0 2.682 2.282 16.975 16.975 0 0 0 1.145.742ZM12 13.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd" />
                            </svg>
                            {{exchange.place}}</h2>
                    </div>
                    
                    <div class="flex justify-between items-center gap-x-1 border-t border-gray-200 pt-2">
                        <p class="italic text-gray-400">{{ exchange.createdAt | timeAgo }}</p>
                        <a href="/plant/{{exchange.id}}" class="font-semibold text-sm text-green-900 opacity-75">View Details</a>
                    </div>
                </div>
                
            </div>
        }
    </div>

    <div class="flex justify-center pt-5">
        <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" (newPage)="nextPage($event)"></app-pagination>
    </div>
</div>
