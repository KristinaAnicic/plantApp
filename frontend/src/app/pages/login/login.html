<div class="flex justify-center py-10 px-5">
    <div class="flex flex-col flex-wrap bg-white shadow-lg shadow-green-900/50 border border-gray-100 border-2 w-100 px-7 py-10 rounded-xl gap-y-5">
        <img src="/assets/images/logo.png" alt="logo" class="h-17 object-contain">

        @if (showWarning()){
        <div class="p-4 flex items-center bg-red-50 w-full rounded-xl border border-red-200">
            <p class="text-sm flex-1 text-center">{{ 'login.incorrect' | translate }}</p>
            <button (click)="closeWarningClick()" type="button" class="justify-center items-center cursor-pointer p-1" data-modal-hide="authentication-modal">
                    <svg class="w-4 h-4 text-red-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                    <span class="sr-only">Close modal</span>
            </button>
        </div>
        }
        <form [formGroup]="loginForm" (ngSubmit)="login()" ngNativeValidate class="flex flex-col gap-y-2">
            <input type="text" id="usernameOrEmail" formControlName="usernameOrEmail" class="block w-full p-3 ps-5 border border-default-medium border-green-900 text-heading text-sm rounded-full focus:ring-2 shadow-xs placeholder:text-body" [placeholder]="'login.emailOrUsername' | translate" autocomplete="off" required />
            <input type="password" id="password" formControlName="password" class="block w-full p-3 ps-5 border border-default-medium border-green-900 text-heading text-sm rounded-full focus:ring-2 shadow-xs placeholder:text-body" [placeholder]="'login.password' | translate" autocomplete="off" required />
            <button type="submit" class="mt-4 w-full bg-green-900 hover:bg-green-800 text-white text-sm py-2 px-4 rounded-full transition-all cursor-pointer">
                {{ 'login.login' | translate }}
            </button>
        </form>
        
        <div class="text-sm font-medium text-body self-center">{{"login.notRegistered" | translate }} <a href="/register" class="text-fg-brand text-blue-700 hover:underline">{{"login.createAccount" | translate }}</a></div>
        
    </div>
</div>
