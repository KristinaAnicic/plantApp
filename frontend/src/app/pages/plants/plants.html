<div class="flex flex-col w-full px-10">
    
    <div class="w-full flex justify-center mb-2">
        <div class="w-full max-w-md">
            <app-search-component (searchTriggered)="search($event)"></app-search-component>
        </div>
    </div>

    <div class="flex flex-wrap gap-3 sm:gap-5 justify-center">      
        @for (plant of plants(); track plant.plantId){
            <div [routerLink]="['/plant', plant.plantId]" class="flex flex-col w-40 sm:w-56 p-3 border border-green-800 rounded-2xl bg-white shadow-sm overflow-hidden cursor-pointer">
                
                <div class="h-40 sm:h-48 w-full overflow-hidden rounded-xl bg-gray-100 flex-shrink-0 content-center">
                    @if (plant.image) {
                        <img [src]="plant.image" (error)="plant.image = 'assets/icons/placeholder.svg'" class="w-full h-full object-cover"/>
                    } @else {
                        <!--<svg class="w-16 h-16 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>-->
                        <svg class="lucide lucide-sprout-icon lucide-sprout w-16 h-16 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/>
                        </svg>
                    }
                </div>           
                
                <div class="my-2 flex-grow flex flex-col items-center justify-center text-center">
                    <h2 class="font-bold text-green-900 leading-tight capitalize">{{plant.botanicalName}}</h2>
                    <h2 class="text-sm italic text-gray-500 mt-1 capitalize">{{plant.commonName}}</h2>
                </div>
                
                <button class="mt-auto w-full bg-green-900 hover:bg-green-800 text-white text-sm py-2 px-4 rounded-full transition-all cursor-pointer">
                    More
                </button>
            </div>
        }
    </div>

    <div class="flex justify-end">
        <app-pagination [currentPage]="currentPage()" [totalPages]="20" (newPage)="nextPage($event)"></app-pagination>
    </div>
</div>
