<div class="flex flex-col w-full px-10">
    <h2 class="pt-3 font-bold text-2xl">{{"plantCatalog.find" | translate }}</h2>
    <div class="w-full flex justify-between items-center">
        <div class="w-full max-w-md py-5">
            <app-search-component (searchTriggered)="search($event)" [currentText]="currentSearchTerm()"></app-search-component>
        </div>
        @if (authService.isAdmin()) {
        <div class="items-center">
            <button (click)="addNewPlantClick()" type="button" class="bg-green-900 text-white cursor-pointer font-medium rounded text-xs px-5 py-3 focus:outline-none">{{"plantCatalog.add" | translate }}</button>
        </div>
        }
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-3 justify-center">      
        @for (plant of plants(); track plant.plantId){
            <div [routerLink]="['/plant', plant.plantId]" class="bg-white flex flex-col transition hover:scale-102 shadow-lg shadow-green-900/50 rounded-2xl overflow-hidden cursor-pointer">
                
                <div class="h-54 sm:h-48 w-full overflow-hidden rounded-t-xl bg-gray-100 flex-shrink-0 content-center">
                    @if (plant.image) {
                        <img [src]="plant.image" (error)="plant.image = 'assets/icons/placeholder.svg'" class="w-full h-full object-cover"/>
                    } @else {
                        <!--<svg class="w-16 h-16 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>-->
                        <svg class="lucide lucide-sprout-icon lucide-sprout w-16 h-16 text-gray-400 mx-auto" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/>
                        </svg>
                    }
                </div>           
                
                <div class="flex flex-col p-3 h-full justify-between">          
                    <div class="my-2 flex-grow flex-1 flex-col items-center justify-center">
                        <h2 class="font-bold text-green-900 leading-tight capitalize">{{plant.botanicalName}}</h2>
                        <h2 class="text-sm italic text-gray-500 mt-1 capitalize">{{plant.commonName}}</h2>
                        <p class="text-sm text-gray-700 mt-1 line-clamp-3 pt-3 mb-2">{{plant.entityDescription}}</p>
                    </div>
                    
                    <div class="flex justify-end items-center gap-x-1 border-t border-gray-200 pt-2">
                        <a href="/plant/{{plant.plantId}}" class="font-semibold text-sm text-green-900 opacity-75">{{"common.viewDetails" | translate }}</a>
                        <svg class="w-4 h-5 translate-y-0.5 text-green-900 opacity-75" clip-rule="evenodd" fill-rule="evenodd" stroke-linejoin="round" stroke-miterlimit="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="m14.523 18.787s4.501-4.505 6.255-6.26c.146-.146.219-.338.219-.53s-.073-.383-.219-.53c-1.753-1.754-6.255-6.258-6.255-6.258-.144-.145-.334-.217-.524-.217-.193 0-.385.074-.532.221-.293.292-.295.766-.004 1.056l4.978 4.978h-14.692c-.414 0-.75.336-.75.75s.336.75.75.75h14.692l-4.979 4.979c-.289.289-.286.762.006 1.054.148.148.341.222.533.222.19 0 .378-.072.522-.215z" fill="currentColor" fill-rule="nonzero"/>
                        </svg>
                    </div>
                </div>
                
            </div>
        }
    </div>

    <div class="flex justify-center pt-5">
        <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" (newPage)="nextPage($event)"></app-pagination>
    </div>
</div>
